name: moonbox
description: "MoonTV - a native Jellyfin/Emby/Plex library and MoonTV/LunaTV/TVBox source client for Android."
publish_to: 'none'
version: 1.4.0+17

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # Networking and local storage
  dio: ^5.11.1
  shared_preferences: ^2.5.5

  # Playback (libmpv / ExoPlayer-backed media_kit)
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_android_video: 1.3.8
  wakelock_plus: ^1.3.3

  # Images
  cached_network_image: ^3.4.1

  # XML fallback for older TVBox type-0 APIs
  xml: ^6.6.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
